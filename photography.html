<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photography - Deep Soni Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Electrolize&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="particles-js"></div>
  
  <header>
    <!-- Mobile header for small screens -->
    <div class="mobile-header">
      <span class="menu-icon" id="mobile-menu-toggle">&#9776;</span>
      <span class="current-page">Photography</span>
    </div>
    <!-- Mobile navigation menu (hidden by default) -->
    <nav class="mobile-nav" id="mobile-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="background.html">Background</a></li>
        <li><a href="work.html">Work</a></li>
        <li><a href="research.html">Research</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="photography.html">Photography</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
    <!-- Desktop navigation for larger screens -->
    <nav class="desktop-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="background.html">Background</a></li>
        <li><a href="work.html">Work</a></li>
        <li><a href="research.html">Research</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="photography.html" class="active">Photography</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>
  
  <main>
    <section class="card-grid">
      <div class="photography-wrapper section-wrapper">
        <h2>Photography</h2>
        <div class="card photography-card">
          <div class="photo-grid">
            <img src="images/photo1.jpeg" alt="Photography Sample 1" loading="lazy" decoding="async">
            <img src="images/photo2.jpeg" alt="Photography Sample 2" loading="lazy" decoding="async">
            <img src="images/photo3.jpeg" alt="Photography Sample 3" loading="lazy" decoding="async">
            <img src="images/photo4.jpeg" alt="Photography Sample 4" loading="lazy" decoding="async">
            <img src="images/photo5.jpeg" alt="Photography Sample 5" loading="lazy" decoding="async">
            <img src="images/photo6.jpeg" alt="Photography Sample 6" loading="lazy" decoding="async">
            <img src="images/photo7.jpeg" alt="Photography Sample 7" loading="lazy" decoding="async">
            <img src="images/photo8.jpeg" alt="Photography Sample 8" loading="lazy" decoding="async">
            <img src="images/photo9.jpeg" alt="Photography Sample 9" loading="lazy" decoding="async">
            <img src="images/photo10.jpeg" alt="Photography Sample 10" loading="lazy" decoding="async">
          </div>
        </div>
      </div>
    </section>
  </main>
  
  <!-- Modal for Gallery Popup -->
  <div id="modal" class="modal">
    <div class="modal-panel">
      <span class="modal-close" aria-label="Close">&times;</span>
      <button class="modal-prev" aria-label="Previous image">&#10094;</button>
      <img class="modal-content" id="modal-image" alt="Expanded photography view">
      <button class="modal-next" aria-label="Next image">&#10095;</button>
    </div>
  </div>
  
  <footer>
    <p>&copy; 2025 Deep Soni. All rights reserved.</p>
  </footer>
  
  <script src="particles.min.js"></script>
  <script src="script.js"></script>
  <script>
    // Modal Gallery JavaScript
    var modal = document.getElementById("modal");
    var modalImage = document.getElementById("modal-image");
    var images = document.querySelectorAll(".photo-grid img");
    var currentImageIndex = 0;
    
    images.forEach(function(img, index) {
      img.loading = "lazy";
      img.decoding = "async";
      var markLoaded = function() {
        var delay = index * 80;
        img.style.transitionDelay = delay + "ms";
        img.classList.add("is-loaded");
      };
      if (img.complete) {
        markLoaded();
      } else {
        img.addEventListener("load", markLoaded, { once: true });
      }

      img.addEventListener("click", function() {
        modal.style.display = "block";
        document.body.classList.add("modal-open");
        modalImage.src = this.src;
        currentImageIndex = index;
      });
    });
    
    document.querySelector(".modal-close").addEventListener("click", function() {
      modal.style.display = "none";
      document.body.classList.remove("modal-open");
    });
    
    document.querySelector(".modal-next").addEventListener("click", function(e) {
      currentImageIndex = (currentImageIndex + 1) % images.length;
      modalImage.src = images[currentImageIndex].src;
    });
    
    document.querySelector(".modal-prev").addEventListener("click", function(e) {
      currentImageIndex = (currentImageIndex - 1 + images.length) % images.length;
      modalImage.src = images[currentImageIndex].src;
    });
    
    // Close modal when clicking outside the image
    modal.addEventListener("click", function(e) {
      if (e.target === modal) {
        modal.style.display = "none";
        document.body.classList.remove("modal-open");
      }
    });
  </script>
  <!-- Custom Scroll Indicator -->
  <div id="scrollbar">
    <div id="scrollbar-dot"></div>
  </div>

</body>
</html>
